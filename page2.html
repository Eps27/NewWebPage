<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>67 virus</title>
  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    .big67 {
      font-size: 80px; /* smaller main 67 */
      font-weight: bold;
      animation: rgbFlash 2s infinite;
      position: relative;
      cursor: pointer;
      text-shadow:
        10px 0 rgba(255,0,0,0.3),
        20px 0 rgba(255,165,0,0.2),
        -10px 0 rgba(0,255,255,0.3),
        -20px 0 rgba(255,0,255,0.2);
    }

    .back-button {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      font-size: 18px;
      font-weight: bold;
      background: red;
      color: white;
      border: none;
      cursor: pointer;
    }

    .spazz67 {
      position: absolute;
      font-size: 60px; /* clone size */
      font-weight: bold;
      animation: rgbFlash 0.5s infinite; /* faster flashing */
      opacity: 1;
      pointer-events: none;
    }

    @keyframes rgbFlash {
      0%   { color: red; }
      25%  { color: orange; }
      50%  { color: lime; }
      75%  { color: cyan; }
      100% { color: magenta; }
    }
  </style>
</head>
<body>
  <div class="big67" id="main67">67</div>
  <button class="back-button" onclick="history.back()">Go Back</button>

  <script>
    function spawnSpazz67() {
      const spazz = document.createElement('div');
      spazz.textContent = '67';
      spazz.className = 'spazz67';
      document.body.appendChild(spazz);

      // Get main 67 position
      const main = document.getElementById('main67');
      const rect = main.getBoundingClientRect();

      // Start clone at main 67’s center
      let x = rect.left + rect.width / 2;
      let y = rect.top + rect.height / 2;

      // Much faster random velocity
      let dx = (Math.random() < 0.5 ? -1 : 1) * 50;
      let dy = (Math.random() < 0.5 ? -1 : 1) * 50;

      spazz.style.left = x + 'px';
      spazz.style.top = y + 'px';

      function move() {
        x += dx;
        y += dy;

        // Bounce off edges
        if (x <= 0 || x >= window.innerWidth - 100) dx *= -1;
        if (y <= 0 || y >= window.innerHeight - 100) dy *= -1;

        spazz.style.left = x + 'px';
        spazz.style.top = y + 'px';
      }

      const interval = setInterval(move, 10); // faster updates

      // Remove after 5 seconds
      setTimeout(() => {
        clearInterval(interval);
        spazz.remove();
      }, 5000);
    }

    document.getElementById('main67').addEventListener('click', spawnSpazz67);
  </script>
</body>
</html>

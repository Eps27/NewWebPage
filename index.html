<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>67 Spiral Illusion</title>
  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: white;
    }

    /* Spiral illusion */
    .spiral span {
      position: absolute;
      font-size: 35px;
      color: white;
      animation: spin 20s linear infinite, rgbShift 5s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @keyframes rgbShift {
      0%   { color: red; }
      20%  { color: orange; }
      40%  { color: yellow; }
      60%  { color: lime; }
      80%  { color: cyan; }
      100% { color: violet; }
    }

    /* Foreground chaotic 67s */
    .foreground span {
      position: absolute;
      font-size: 50px;
      opacity: 0.8;
      animation: moveAround linear infinite;
    }

    /* Button styling */
    .next-button {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 30px;
      font-size: 30px;
      font-weight: bold;
      background: red;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Spiral illusion -->
  <div class="spiral" id="spiral"></div>

  <!-- Foreground animated 67s -->
  <div class="foreground" id="foreground"></div>

  <!-- Button to next page -->
  <button class="next-button" onclick="location.href='page2.html'">Next 67</button>

  <script>
    // Generate spiral illusion from center
    const spiral = document.getElementById('spiral');
    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2;

    for (let i = 0; i < 300; i++) {
      const span = document.createElement('span');
      span.textContent = '67';
      const angle = i * 0.2;
      const radius = i * 3;
      const x = centerX + Math.cos(angle) * radius;
      const y = centerY + Math.sin(angle) * radius;
      span.style.left = x + 'px';
      span.style.top = y + 'px';
      spiral.appendChild(span);
    }

    // Foreground chaotic 67s (slower drift)
    const foreground = document.getElementById('foreground');
    const styleSheet = document.styleSheets[0];
    const colors = ['red', 'purple', 'orange', 'lime', 'yellow'];
    for (let i = 0; i < 120; i++) {
      const span = document.createElement('span');
      span.textContent = '67';
      span.style.top = Math.random() * 100 + '%';
      span.style.left = Math.random() * 100 + '%';
      span.style.color = colors[Math.floor(Math.random() * colors.length)];

      const duration = 8 + Math.random() * 4; // 8–12s
      const delay = Math.random() * 2;
      span.style.animationDuration = duration + 's';
      span.style.animationDelay = delay + 's';

      const dx = (Math.random() - 0.5) * 300;
      const dy = (Math.random() - 0.5) * 300;
      span.style.animationName = 'move' + i;

      styleSheet.insertRule(`
        @keyframes move${i} {
          from { transform: translate(0,0) rotate(0deg); }
          to { transform: translate(${dx}px, ${dy}px) rotate(360deg); }
        }
      `, styleSheet.cssRules.length);

      foreground.appendChild(span);
    }
  </script>
</body>
</html>

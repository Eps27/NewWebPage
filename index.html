<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>67 virus</title>
  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: white;
    }

    /* Spiral container */
    .spiral span {
      position: absolute;
      font-size: 35px;
      animation: spiralMove 10s linear infinite;
      animation-delay: var(--delay);
      background: linear-gradient(90deg, red, orange, yellow, lime, cyan, blue, violet);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    @keyframes spiralMove {
      0%   { transform: rotate(0deg) translateX(0); }
      100% { transform: rotate(720deg) translateX(200px); }
    }

    /* Foreground chaotic 67s */
    .foreground span {
      position: absolute;
      font-size: 50px;
      opacity: 0.9;
      animation: moveAround linear infinite;
    }

    /* Button styling */
    .next-button {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 30px;
      font-size: 30px;
      font-weight: bold;
      background: red;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Spiral background -->
  <div class="spiral" id="spiral"></div>

  <!-- Foreground animated 67s -->
  <div class="foreground" id="foreground"></div>

  <!-- Button to next page -->
  <button class="next-button" onclick="location.href='page2.html'">Next 67</button>

  <script>
    // Generate spiral of 67s with RGB effect
    const spiral = document.getElementById('spiral');
    for (let i = 0; i < 150; i++) {
      const span = document.createElement('span');
      span.textContent = '67';
      const angle = i * 0.2;
      const radius = i * 4;
      const x = Math.cos(angle) * radius + 'px';
      const y = Math.sin(angle) * radius + 'px';
      span.style.left = x;
      span.style.top = y;
      span.style.setProperty('--delay', (i * 0.05) + 's');
      spiral.appendChild(span);
    }

    // Generate chaotic foreground 67s (slower)
    const foreground = document.getElementById('foreground');
    const styleSheet = document.styleSheets[0];
    const colors = ['red', 'purple', 'orange', 'lime', 'yellow'];
    for (let i = 0; i < 150; i++) {
      const span = document.createElement('span');
      span.textContent = '67';
      span.style.top = Math.random() * 100 + '%';
      span.style.left = Math.random() * 100 + '%';
      span.style.color = colors[Math.floor(Math.random() * colors.length)];

      // Slower animation speed
      const duration = 4 + Math.random() * 3; // 4–7s
      const delay = Math.random() * 2;        // stagger start
      span.style.animationDuration = duration + 's';
      span.style.animationDelay = delay + 's';

      // Randomize direction
      const dx = (Math.random() - 0.5) * 600; // -300 to +300 px
      const dy = (Math.random() - 0.5) * 600;
      span.style.animationName = 'move' + i;

      styleSheet.insertRule(`
        @keyframes move${i} {
          from { transform: translate(0,0) rotate(0deg); }
          to { transform: translate(${dx}px, ${dy}px) rotate(360deg); }
        }
      `, styleSheet.cssRules.length);

      foreground.appendChild(span);
    }
  </script>
</body>
</html>

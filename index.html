<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hypnotic 67 Spiral</title>
  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
    }

    /* Spiral illusion container */
    .spiral {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: rotate 8s linear infinite, pulse 5s ease-in-out infinite;
    }

    .spiral span {
      position: absolute;
      font-size: 30px;
      color: white;
      animation: rgbShift 4s linear infinite;
    }

    @keyframes rotate {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to   { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50%      { transform: translate(-50%, -50%) scale(1.15); }
    }

    @keyframes rgbShift {
      0%   { color: red; }
      20%  { color: orange; }
      40%  { color: yellow; }
      60%  { color: lime; }
      80%  { color: cyan; }
      100% { color: violet; }
    }

    .next-button {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 30px;
      font-size: 30px;
      font-weight: bold;
      background: red;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="spiral" id="spiral"></div>
  <button class="next-button" onclick="location.href='page2.html'">Next 67</button>

  <script>
    // Build spiral illusion centered
    const spiral = document.getElementById('spiral');
    for (let i = 0; i < 300; i++) {
      const span = document.createElement('span');
      span.textContent = '67';
      const angle = i * 0.2;
      const radius = i * 3;
      const x = Math.cos(angle) * radius + 'px';
      const y = Math.sin(angle) * radius + 'px';
      span.style.left = x;
      span.style.top = y;
      spiral.appendChild(span);
    }
  </script>
</body>
</html>

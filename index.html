<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>67 virus</title>
  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: white;
    }

    /* Spiral container */
    .spiral {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 35px;
      color: #00f0ff; /* neon blue */
      opacity: 0.7;
    }

    /* Foreground chaotic 67s */
    .foreground span {
      position: absolute;
      font-size: 50px;
      opacity: 0.9;
      animation: moveAround linear infinite;
    }

    /* Button styling */
    .next-button {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 30px;
      font-size: 30px;
      font-weight: bold;
      background: red;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Spiral background -->
  <div class="spiral" id="spiral"></div>

  <!-- Foreground animated 67s -->
  <div class="foreground" id="foreground"></div>

  <!-- Button to next page -->
  <button class="next-button" onclick="location.href='page2.html'">Next 67</button>

  <script>
    // Generate spiral of 67s
    const spiral = document.getElementById('spiral');
    for (let i = 0; i < 300; i++) {
      const span = document.createElement('span');
      span.textContent = '67';
      span.style.position = 'absolute';
      const angle = i * 0.2;
      const radius = i * 2;
      const x = Math.cos(angle) * radius + 'px';
      const y = Math.sin(angle) * radius + 'px';
      span.style.left = x;
      span.style.top = y;
      spiral.appendChild(span);
    }

    // Generate chaotic foreground 67s (multi-color, faster, more)
    const foreground = document.getElementById('foreground');
    const styleSheet = document.styleSheets[0];
    const colors = ['red', 'purple', 'orange', 'lime', 'yellow']; // five colors
    for (let i = 0; i < 800; i++) { // more invaders
      const span = document.createElement('span');
      span.textContent = '67';
      span.style.top = Math.random() * 100 + '%';
      span.style.left = Math.random() * 100 + '%';
      span.style.color = colors[Math.floor(Math.random() * colors.length)];

      // Faster animation speed
      const duration = 1 + Math.random() * 2.5; // 1–3.5s
      const delay = Math.random() * 1.5;        // stagger start
      span.style.animationDuration = duration + 's';
      span.style.animationDelay = delay + 's';

      // Randomize direction
      const dx = (Math.random() - 0.5) * 1000; // -500 to +500 px
      const dy = (Math.random() - 0.5) * 1000;
      span.style.animationName = 'move' + i;

      styleSheet.insertRule(`
        @keyframes move${i} {
          from { transform: translate(0,0) rotate(0deg); }
          to { transform: translate(${dx}px, ${dy}px) rotate(360deg); }
        }
      `, styleSheet.cssRules.length);

      foreground.appendChild(span);
    }
  </script>
</body>
</html>

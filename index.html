<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hypnotic 67 Spiral</title>
  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
    }

    /* Spiral container spins clockwise */
    .spiral {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: spin 6s linear infinite; /* clockwise spin */
    }

    .spiral span {
      position: absolute;
      font-size: var(--size);
      color: hsl(var(--hue), 100%, 50%);
      animation: hueShift 8s linear infinite;
    }

    @keyframes spin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to   { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes hueShift {
      0%   { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    .next-button {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 30px;
      font-size: 30px;
      font-weight: bold;
      background: red;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="spiral" id="spiral"></div>
  <button class="next-button" onclick="location.href='page2.html'">Next 67</button>

  <script>
    // Build spiral illusion centered
    const spiral = document.getElementById('spiral');
    let radius = 0;

    for (let i = 0; i < 300; i++) {
      const span = document.createElement('span');
      span.textContent = '67';

      // angle progression
      const angle = i * 0.2;

      // gradually increase radius spacing (compounded after 180)
      if (i < 180) {
        radius += 2; // tighter spacing near center
      } else {
        radius += 2 + (i - 180) * 0.05; // spacing grows faster outward
      }

      const x = Math.cos(angle) * radius + 'px';
      const y = Math.sin(angle) * radius + 'px';

      // size grows with radius
      const size = 8 + radius * 0.05; 
      span.style.setProperty('--size', size + 'px');

      // hue shifts gradually across spiral
      const hue = (i * 2) % 360; 
      span.style.setProperty('--hue', hue);

      span.style.left = x;
      span.style.top = y;
      spiral.appendChild(span);
    }
  </script>
</body>
</html>

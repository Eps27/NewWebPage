<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hypnotic 67 Spiral</title>
  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
    }

    /* Spiral illusion container */
    .spiral {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: rotate 20s linear infinite, pulse 6s ease-in-out infinite;
    }

    .spiral span {
      position: absolute;
      font-size: 30px;
      color: white;
      animation: rgbShift 5s linear infinite;
    }

    @keyframes rotate {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to   { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50%      { transform: translate(-50%, -50%) scale(1.1); }
    }

    @keyframes rgbShift {
      0%   { color: red; }
      20%  { color: orange; }
      40%  { color: yellow; }
      60%  { color: lime; }
      80%  { color: cyan; }
      100% { color: violet; }
    }

    /* Foreground chaotic 67s */
    .foreground span {
      position: absolute;
      font-size: 50px;
      opacity: 0.7;
      animation: moveAround linear infinite;
    }

    .next-button {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 30px;
      font-size: 30px;
      font-weight: bold;
      background: red;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="spiral" id="spiral"></div>
  <div class="foreground" id="foreground"></div>
  <button class="next-button" onclick="location.href='page2.html'">Next 67</button>

  <script>
    // Build spiral illusion centered
    const spiral = document.getElementById('spiral');
    for (let i = 0; i < 300; i++) {
      const span = document.createElement('span');
      span.textContent = '67';
      const angle = i * 0.2;
      const radius = i * 3;
      const x = Math.cos(angle) * radius + 'px';
      const y = Math.sin(angle) * radius + 'px';
      span.style.left = x;
      span.style.top = y;
      spiral.appendChild(span);
    }

    // Foreground drifting 67s
    const foreground = document.getElementById('foreground');
    const styleSheet = document.styleSheets[0];
    const colors = ['red', 'purple', 'orange', 'lime', 'yellow'];
    for (let i = 0; i < 100; i++) {
      const span = document.createElement('span');
      span.textContent = '67';
      span.style.top = Math.random() * 100 + '%';
      span.style.left = Math.random() * 100 + '%';
      span.style.color = colors[Math.floor(Math.random() * colors.length)];

      const duration = 10 + Math.random() * 5; // slower drift
      const delay = Math.random() * 3;
      span.style.animationDuration = duration + 's';
      span.style.animationDelay = delay + 's';

      const dx = (Math.random() - 0.5) * 200;
      const dy = (Math.random() - 0.5) * 200;
      span.style.animationName = 'move' + i;

      styleSheet.insertRule(`
        @keyframes move${i} {
          from { transform: translate(0,0) rotate(0deg); }
          to { transform: translate(${dx}px, ${dy}px) rotate(360deg); }
        }
      `, styleSheet.cssRules.length);

      foreground.appendChild(span);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hypnotic 67 Spiral</title>
  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
    }

    /* Spiral container spins as a whole */
    .spiral {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: spin 6s linear infinite; /* faster spin */
    }

    .spiral span {
      position: absolute;
      font-size: 30px;
      color: white;
    }

    @keyframes spin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to   { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .next-button {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 30px;
      font-size: 30px;
      font-weight: bold;
      background: red;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="spiral" id="spiral"></div>
  <button class="next-button" onclick="location.href='page2.html'">Next 67</button>

  <script>
    // Build spiral illusion centered
    const spiral = document.getElementById('spiral');
    for (let i = 0; i < 300; i++) {
      const span = document.createElement('span');
      span.textContent = '67';
      const angle = i * 0.2;
      const radius = i * 3;
      const x = Math.cos(angle) * radius + 'px';
      const y = Math.sin(angle) * radius + 'px';
      span.style.left = x;
      span.style.top = y;
      spiral.appendChild(span);
    }
  </script>
</body>
</html>
